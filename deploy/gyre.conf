# nginx · gyre.trade → GYRE on 127.0.0.1:5520
# Installed to /etc/nginx/conf.d/gyre.trade.conf by setup-vps.sh; certbot adds the 443 block.
server {
    listen 80;
    listen [::]:80;
    server_name gyre.trade www.gyre.trade;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5520;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: no buffering, long-lived connections
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
